<svg width="1440" height="960" viewBox="0 0 1440 960" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Customer SMM Panel dashboard mockup</title>
  <desc id="desc">Dark modern customer dashboard with quick order form, balance, services, recent orders, and stats.</desc>
  <rect width="1440" height="960" fill="#07111F"/>
  <circle cx="196" cy="106" r="270" fill="#0EA5E9" opacity="0.16"/>
  <circle cx="1245" cy="155" r="360" fill="#8B5CF6" opacity="0.12"/>
  <rect x="32" y="32" width="280" height="896" rx="28" fill="#0B1526" stroke="#1E293B"/>
  <text x="64" y="88" fill="#E5EEFB" font-family="Inter, Arial" font-size="30" font-weight="800">SMM Pro</text>
  <text x="64" y="118" fill="#38BDF8" font-family="Inter, Arial" font-size="13" font-weight="700" letter-spacing="3">CUSTOMER</text>
  <g font-family="Inter, Arial" font-size="17" font-weight="650">
    <rect x="56" y="162" width="224" height="54" rx="16" fill="#0EA5E9"/>
    <text x="86" y="197" fill="white">Dashboard</text>
    <text x="86" y="260" fill="#94A3B8">Quick Order</text>
    <text x="86" y="318" fill="#94A3B8">Services</text>
    <text x="86" y="376" fill="#94A3B8">Orders</text>
    <text x="86" y="434" fill="#94A3B8">Transactions</text>
    <text x="86" y="492" fill="#94A3B8">Support</text>
    <text x="86" y="550" fill="#94A3B8">API</text>
    <text x="86" y="608" fill="#94A3B8">Referral</text>
  </g>
  <rect x="56" y="792" width="224" height="96" rx="20" fill="#111C31" stroke="#243247"/>
  <text x="80" y="830" fill="#94A3B8" font-family="Inter, Arial" font-size="14">Available balance</text>
  <text x="80" y="866" fill="#22C55E" font-family="Inter, Arial" font-size="30" font-weight="800">$248.50</text>

  <text x="352" y="82" fill="#E5EEFB" font-family="Inter, Arial" font-size="36" font-weight="800">Place a new order</text>
  <text x="352" y="116" fill="#94A3B8" font-family="Inter, Arial" font-size="16">Fast guided checkout for Instagram, TikTok, YouTube, Facebook and more.</text>
  <rect x="1110" y="50" width="260" height="54" rx="18" fill="#0B1526" stroke="#243247"/>
  <text x="1134" y="83" fill="#CBD5E1" font-family="Inter, Arial" font-size="15">Search services...</text>

  <rect x="352" y="150" width="640" height="594" rx="28" fill="#0B1526" stroke="#1E293B"/>
  <text x="386" y="204" fill="#E5EEFB" font-family="Inter, Arial" font-size="24" font-weight="800">Quick order</text>
  <text x="386" y="232" fill="#94A3B8" font-family="Inter, Arial" font-size="14">Backend will recalculate price and validate balance.</text>
  <g font-family="Inter, Arial">
    <text x="386" y="286" fill="#CBD5E1" font-size="14" font-weight="700">Platform</text>
    <rect x="386" y="304" width="270" height="56" rx="16" fill="#111C31" stroke="#243247"/>
    <text x="410" y="339" fill="#E5EEFB" font-size="16">Instagram</text>
    <text x="690" y="286" fill="#CBD5E1" font-size="14" font-weight="700">Category</text>
    <rect x="690" y="304" width="268" height="56" rx="16" fill="#111C31" stroke="#243247"/>
    <text x="714" y="339" fill="#E5EEFB" font-size="16">Followers</text>
    <text x="386" y="404" fill="#CBD5E1" font-size="14" font-weight="700">Service</text>
    <rect x="386" y="422" width="572" height="56" rx="16" fill="#111C31" stroke="#243247"/>
    <text x="410" y="457" fill="#E5EEFB" font-size="16">Instagram Followers - High Quality - Refill 30 days</text>
    <text x="386" y="522" fill="#CBD5E1" font-size="14" font-weight="700">Target link</text>
    <rect x="386" y="540" width="572" height="56" rx="16" fill="#111C31" stroke="#243247"/>
    <text x="410" y="575" fill="#64748B" font-size="16">https://instagram.com/username</text>
    <text x="386" y="640" fill="#CBD5E1" font-size="14" font-weight="700">Quantity</text>
    <rect x="386" y="658" width="270" height="56" rx="16" fill="#111C31" stroke="#243247"/>
    <text x="410" y="693" fill="#E5EEFB" font-size="16">1,000</text>
    <rect x="690" y="658" width="268" height="56" rx="16" fill="#22C55E"/>
    <text x="762" y="693" fill="#052E16" font-size="17" font-weight="800">Submit order</text>
  </g>

  <rect x="1032" y="150" width="338" height="168" rx="28" fill="#0B1526" stroke="#1E293B"/>
  <text x="1066" y="202" fill="#94A3B8" font-family="Inter, Arial" font-size="15">Estimated total</text>
  <text x="1066" y="250" fill="#E5EEFB" font-family="Inter, Arial" font-size="42" font-weight="850">$12.80</text>
  <text x="1066" y="286" fill="#22C55E" font-family="Inter, Arial" font-size="14">Balance is sufficient</text>

  <rect x="1032" y="348" width="338" height="396" rx="28" fill="#0B1526" stroke="#1E293B"/>
  <text x="1066" y="402" fill="#E5EEFB" font-family="Inter, Arial" font-size="22" font-weight="800">Recent orders</text>
  <g font-family="Inter, Arial" font-size="14">
    <rect x="1066" y="430" width="270" height="64" rx="16" fill="#111C31"/>
    <text x="1088" y="457" fill="#E5EEFB" font-weight="700">Instagram followers</text><text x="1088" y="478" fill="#38BDF8">Processing</text>
    <rect x="1066" y="512" width="270" height="64" rx="16" fill="#111C31"/>
    <text x="1088" y="539" fill="#E5EEFB" font-weight="700">TikTok likes</text><text x="1088" y="560" fill="#22C55E">Completed</text>
    <rect x="1066" y="594" width="270" height="64" rx="16" fill="#111C31"/>
    <text x="1088" y="621" fill="#E5EEFB" font-weight="700">YouTube views</text><text x="1088" y="642" fill="#F59E0B">Partial</text>
  </g>

  <rect x="352" y="784" width="1018" height="144" rx="28" fill="#0B1526" stroke="#1E293B"/>
  <text x="386" y="836" fill="#E5EEFB" font-family="Inter, Arial" font-size="22" font-weight="800">Top service categories</text>
  <g font-family="Inter, Arial" font-size="15" font-weight="700">
    <rect x="386" y="862" width="160" height="38" rx="19" fill="#111C31" stroke="#243247"/><text x="426" y="886" fill="#CBD5E1">Followers</text>
    <rect x="562" y="862" width="160" height="38" rx="19" fill="#111C31" stroke="#243247"/><text x="620" y="886" fill="#CBD5E1">Likes</text>
    <rect x="738" y="862" width="160" height="38" rx="19" fill="#111C31" stroke="#243247"/><text x="790" y="886" fill="#CBD5E1">Views</text>
    <rect x="914" y="862" width="160" height="38" rx="19" fill="#111C31" stroke="#243247"/><text x="960" y="886" fill="#CBD5E1">Comments</text>
  </g>
</svg>
